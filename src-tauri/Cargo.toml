[package]
name = "sportsball-go"
version = "0.1.0"
description = "Sportsball Go - live sports scoreboard & ticker"
edition = "2021"

[lib]
name = "sportsball_go_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "SportsballGo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
