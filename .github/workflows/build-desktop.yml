name: Build Desktop (Windows + Linux)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev zip

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build Tauri app
        run: npm run tauri -- build

      - name: Package Windows (installer + portable zip)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts
          Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Copy-Item -Destination dist-artifacts/
          Compress-Archive -Path "src-tauri/target/release/SportsballGo.exe" -DestinationPath "dist-artifacts/SportsballGo-Windows-Portable.zip"

      - name: Package Linux (AppImage + portable zip)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist-artifacts
          cp src-tauri/target/release/bundle/appimage/*.AppImage dist-artifacts/ 2>/dev/null || true
          (cd src-tauri/target/release && zip ../../../dist-artifacts/SportsballGo-Linux-Portable.zip SportsballGo)

      - uses: actions/upload-artifact@v4
        with:
          name: SportsballGo-${{ matrix.platform }}
          path: dist-artifacts/*
          retention-days: 14
