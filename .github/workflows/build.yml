name: Build (Windows, Linux, Android)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev zip

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build Tauri app
        run: npm run tauri -- build

      - name: Package Windows (installer + portable zip)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts
          Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Copy-Item -Destination dist-artifacts/
          Compress-Archive -Path "src-tauri/target/release/SportsballGo.exe" -DestinationPath "dist-artifacts/SportsballGo-Windows-Portable.zip"

      - name: Package Linux (AppImage + portable zip)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist-artifacts
          cp src-tauri/target/release/bundle/appimage/*.AppImage dist-artifacts/
          (cd src-tauri/target/release && zip ../../../dist-artifacts/SportsballGo-Linux-Portable.zip SportsballGo)

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows'
        with:
          name: SportsballGo-Windows-Installer.exe
          path: dist-artifacts/*.exe
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows'
        with:
          name: SportsballGo-Windows-Portable.zip
          path: dist-artifacts/SportsballGo-Windows-Portable.zip
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux'
        with:
          name: SportsballGo-Linux.AppImage
          path: dist-artifacts/*.AppImage
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux'
        with:
          name: SportsballGo-Linux-Portable.zip
          path: dist-artifacts/SportsballGo-Linux-Portable.zip
          retention-days: 14

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Build web assets and sync into Android project
        run: npm run android:sync

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-artifacts/SportsballGo-Android-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SportsballGo-Android-debug.apk
          path: dist-artifacts/SportsballGo-Android-debug.apk
          retention-days: 14

  release:
    name: Publish "latest" release
    needs: [desktop, android]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - run: ls -l release-files

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: release-files/*
