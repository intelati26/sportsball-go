name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Build web assets and sync into Android project
        run: npm run android:sync

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-artifacts/SportsballGo-Android-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SportsballGo-android
          path: dist-artifacts/*
          retention-days: 14

      - name: Publish to the "latest" release (files with their extensions)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: dist-artifacts/*
